version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: student-workspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: student-workspace-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"

  backend:
    image: alpine:3.20
    container_name: student-workspace-backend
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "echo 'Backend scaffold placeholder is ready.' && tail -f /dev/null"]
    environment:
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
      API_PREFIX: ${API_PREFIX}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis

  frontend:
    image: alpine:3.20
    container_name: student-workspace-frontend
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "echo 'Frontend scaffold placeholder is ready.' && tail -f /dev/null"]
    environment:
      APP_ENV: ${APP_ENV}
      FRONTEND_PORT: ${FRONTEND_PORT}
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  worker:
    image: alpine:3.20
    container_name: student-workspace-worker
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "echo 'Worker scaffold placeholder is ready.' && tail -f /dev/null"]
    environment:
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
    volumes:
      - ./worker:/app
    depends_on:
      - backend
      - redis

volumes:
  postgres_data:
