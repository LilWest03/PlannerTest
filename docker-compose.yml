version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: student-workspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: student-workspace-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"

  backend:
    image: python:3.12-slim
    container_name: student-workspace-backend
    restart: unless-stopped
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
      ]
    environment:
      APP_NAME: ${PROJECT_NAME}
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
      API_PREFIX: ${API_PREFIX}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DATABASE_URL: ${DATABASE_URL}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
      DEMO_USER_NAME: ${DEMO_USER_NAME}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis

  frontend:
    image: node:20-alpine
    container_name: student-workspace-frontend
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev"]
    environment:
      APP_ENV: ${APP_ENV}
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT}
      INTERNAL_API_URL: http://backend:8000
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  worker:
    image: python:3.12-slim
    container_name: student-workspace-worker
    restart: unless-stopped
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "pip install --no-cache-dir -r requirements.txt && python -m app.main"
      ]
    environment:
      APP_ENV: ${APP_ENV}
      BACKEND_URL: http://backend:8000
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
      WORKER_QUEUE_NAME: agent-jobs
      WORKER_HEARTBEAT_SECONDS: 15
    volumes:
      - ./worker:/app
    depends_on:
      - backend
      - redis

volumes:
  postgres_data:
